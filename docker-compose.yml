services:
  # =============================================
  # BASES DE DATOS - MySQL por Microservicio
  # =============================================

  mysql-usuarios:
    image: mysql:8.0
    container_name: lumina-mysql-usuarios
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_usuarios
      MYSQL_USER: lumina_user
      MYSQL_PASSWORD: lumina_pass
    ports:
      - "3307:3306"
    volumes:
      - vol_mysql_usuarios:/var/lib/mysql
    networks:
      - lumina-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u lumina_user -plumina_pass --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-productos:
    image: mysql:8.0
    container_name: lumina-mysql-productos
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_productos
      MYSQL_USER: lumina_user
      MYSQL_PASSWORD: lumina_pass
    ports:
      - "3308:3306"
    volumes:
      - vol_mysql_productos:/var/lib/mysql
    networks:
      - lumina-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u lumina_user -plumina_pass --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-bodega:
    image: mysql:8.0
    container_name: lumina-mysql-bodega
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_bodega
      MYSQL_USER: lumina_user
      MYSQL_PASSWORD: lumina_pass
    ports:
      - "3309:3306"
    volumes:
      - vol_mysql_bodega:/var/lib/mysql
    networks:
      - lumina-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u lumina_user -plumina_pass --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-carrito:
    image: mysql:8.0
    container_name: lumina-mysql-carrito
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_carrito
      MYSQL_USER: lumina_user
      MYSQL_PASSWORD: lumina_pass
    ports:
      - "3310:3306"
    volumes:
      - vol_mysql_carrito:/var/lib/mysql
    networks:
      - lumina-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u lumina_user -plumina_pass --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-delivery:
    image: mysql:8.0
    container_name: lumina-mysql-delivery
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_delivery
      MYSQL_USER: lumina_user
      MYSQL_PASSWORD: lumina_pass
    ports:
      - "3311:3306"
    volumes:
      - vol_mysql_delivery:/var/lib/mysql
    networks:
      - lumina-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u lumina_user -plumina_pass --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-pagos:
    image: mysql:8.0
    container_name: lumina-mysql-pagos
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_pagos
      MYSQL_USER: lumina_user
      MYSQL_PASSWORD: lumina_pass
    ports:
      - "3312:3306"
    volumes:
      - vol_mysql_pagos:/var/lib/mysql
    networks:
      - lumina-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u lumina_user -plumina_pass --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =============================================
  # MENSAJERÍA - Apache Kafka (Zookeeper + 2 brokers) y Kafka UI
  # =============================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: lumina-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - lumina-network

  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: lumina-kafka-1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"
    networks:
      - lumina-network

  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: lumina-kafka-2
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"
    networks:
      - lumina-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: lumina-kafka-ui
    depends_on:
      - kafka-1
      - kafka-2
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: lumina
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - lumina-network

  # =============================================
  # MENSAJERÍA - Clúster RabbitMQ (2 nodos, consola en :15672 y :15673)
  # =============================================

  rabbitmq1:
    image: rabbitmq:3.13-management
    container_name: lumina-rabbitmq1
    hostname: rabbitmq1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_ERLANG_COOKIE: lumina-cookie-cluster
      RABBITMQ_DEFAULT_USER: lumina
      RABBITMQ_DEFAULT_PASS: lumina_pass
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    networks:
      - lumina-network

  rabbitmq2:
    image: rabbitmq:3.13-management
    container_name: lumina-rabbitmq2
    hostname: rabbitmq2
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_ERLANG_COOKIE: lumina-cookie-cluster
      RABBITMQ_DEFAULT_USER: lumina
      RABBITMQ_DEFAULT_PASS: lumina_pass
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    depends_on:
      - rabbitmq1
    networks:
      - lumina-network

  # =============================================
  # MICROSERVICIOS
  # =============================================

  bff-gateway:
    build: ./bff-gateway
    container_name: lumina-bff-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MS_USUARIOS_URL=http://ms-usuarios:8081
      - MS_PRODUCTOS_URL=http://ms-productos:8082
      - MS_BODEGA_URL=http://ms-bodega:8083
      - MS_CARRITO_URL=http://ms-carrito:8084
      - MS_DELIVERY_URL=http://ms-delivery:8085
      - MS_PAGOS_URL=http://ms-pagos:8086
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:29092,kafka-2:29092
      - SPRING_RABBITMQ_ADDRESSES=rabbitmq1:5672,rabbitmq2:5672
      - SPRING_RABBITMQ_USERNAME=lumina
      - SPRING_RABBITMQ_PASSWORD=lumina_pass
    depends_on:
      - kafka-1
      - kafka-2
      - rabbitmq1
      - rabbitmq2
      - ms-usuarios
      - ms-productos
      - ms-bodega
      - ms-carrito
      - ms-delivery
      - ms-pagos
    networks:
      - lumina-network

  # =============================================
  # FRONTEND (React + Vite servido con nginx)
  # =============================================

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    container_name: lumina-frontend
    ports:
      - "5173:80"
    depends_on:
      - bff-gateway
    networks:
      - lumina-network

  ms-usuarios:
    build: ./ms-usuarios
    container_name: lumina-ms-usuarios
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-usuarios:3306/db_usuarios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=lumina_user
      - SPRING_DATASOURCE_PASSWORD=lumina_pass
    depends_on:
      mysql-usuarios:
        condition: service_healthy
    networks:
      - lumina-network

  ms-productos:
    build: ./ms-productos
    container_name: lumina-ms-productos
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-productos:3306/db_productos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=lumina_user
      - SPRING_DATASOURCE_PASSWORD=lumina_pass
    depends_on:
      mysql-productos:
        condition: service_healthy
    networks:
      - lumina-network

  ms-bodega:
    build: ./ms-bodega
    container_name: lumina-ms-bodega
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-bodega:3306/db_bodega?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=lumina_user
      - SPRING_DATASOURCE_PASSWORD=lumina_pass
      - LUMINA_SQS_ENABLED=false
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:29092,kafka-2:29092
      - SPRING_RABBITMQ_ADDRESSES=rabbitmq1:5672,rabbitmq2:5672
      - SPRING_RABBITMQ_USERNAME=lumina
      - SPRING_RABBITMQ_PASSWORD=lumina_pass
    depends_on:
      mysql-bodega:
        condition: service_healthy
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      rabbitmq1:
        condition: service_started
      rabbitmq2:
        condition: service_started
    networks:
      - lumina-network

  ms-carrito:
    build: ./ms-carrito
    container_name: lumina-ms-carrito
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-carrito:3306/db_carrito?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=lumina_user
      - SPRING_DATASOURCE_PASSWORD=lumina_pass
    depends_on:
      mysql-carrito:
        condition: service_healthy
    networks:
      - lumina-network

  ms-delivery:
    build: ./ms-delivery
    container_name: lumina-ms-delivery
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-delivery:3306/db_delivery?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=lumina_user
      - SPRING_DATASOURCE_PASSWORD=lumina_pass
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:29092,kafka-2:29092
      - SPRING_RABBITMQ_ADDRESSES=rabbitmq1:5672,rabbitmq2:5672
      - SPRING_RABBITMQ_USERNAME=lumina
      - SPRING_RABBITMQ_PASSWORD=lumina_pass
    depends_on:
      mysql-delivery:
        condition: service_healthy
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      rabbitmq1:
        condition: service_started
      rabbitmq2:
        condition: service_started
    networks:
      - lumina-network

  ms-pagos:
    build: ./ms-pagos
    container_name: lumina-ms-pagos
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-pagos:3306/db_pagos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=lumina_user
      - SPRING_DATASOURCE_PASSWORD=lumina_pass
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:-}
      - MERCADOPAGO_WEBHOOK_SECRET=${MERCADOPAGO_WEBHOOK_SECRET:-}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:29092,kafka-2:29092
      - SPRING_RABBITMQ_ADDRESSES=rabbitmq1:5672,rabbitmq2:5672
      - SPRING_RABBITMQ_USERNAME=lumina
      - SPRING_RABBITMQ_PASSWORD=lumina_pass
    depends_on:
      mysql-pagos:
        condition: service_healthy
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      rabbitmq1:
        condition: service_started
      rabbitmq2:
        condition: service_started
    networks:
      - lumina-network

# =============================================
# VOLÚMENES PERSISTENTES
# =============================================
volumes:
  vol_mysql_usuarios:
  vol_mysql_productos:
  vol_mysql_bodega:
  vol_mysql_carrito:
  vol_mysql_delivery:
  vol_mysql_pagos:

# =============================================
# RED INTERNA
# =============================================
networks:
  lumina-network:
    driver: bridge